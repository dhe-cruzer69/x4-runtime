[project]
name = "x4-runtime"
version = "0.1.0"
description = "Local-first model runtime with hardware-aware routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ARIEX4Ops" }]
keywords = ["runtime", "llm", "local", "ollama", "x4"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
x4-runtime = "x4_runtime.cli:main"

[project.urls]
Homepage = "https://github.com/dhe-cruzer69/x4-runtime"
Repository = "https://github.com/dhe-cruzer69/x4-runtime"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
